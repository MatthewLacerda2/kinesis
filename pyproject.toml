[project]
name = "kinesis"
version = "0.1.0"
description = "PureRef-style reference board driven by webcam hand tracking"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.7",
    # Pinned: mediapipe 1.0.x aborts on macOS/arm64 at HandLandmarker init --
    # TensorsToDetectionsCalculator::Open() requires a Metal graph service that
    # the wheel never registers ("Check failed: service_ Service is unavailable").
    # Setting delegate=CPU does not avoid it. 0.10.35 is the newest working build.
    "mediapipe==0.10.35",
    # <5: mediapipe 0.10.x is built against the cv2 4.x line.
    "opencv-python>=4.10,<5",
    "numpy>=2.0",
    # kinesis/mcp_server.py ships in the package and imports it; the import
    # sweep in ./run.sh check is what noticed it was only ever installed by hand.
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kinesis*"]

# The icon is data, not a module, so packages.find does not pick it up on its
# own -- an install without this line ships a package whose window icon is a
# path to a file that isn't there.
[tool.setuptools.package-data]
kinesis = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lint only -- no formatter. Nothing here rewrites code that already reads fine;
# the job is catching dead imports, unsorted imports and real mistakes.
[tool.ruff]
line-length = 100        # what the code was already written to; 88 flagged 52 lines
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # zip(..., strict=): most zips here are the pairwise zip(xs, xs[1:]) idiom,
    # where strict is meaningless, and the two over MediaPipe results would turn
    # a lint into a raise inside the tracker loop. Noise, so it is off.
    "B905",
]
